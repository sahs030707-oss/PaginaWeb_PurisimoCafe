<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mesas — PurísimoCafe</title>
  <link rel="stylesheet" href="../assets/css/main.css"/>
  <link rel="stylesheet" href="../assets/css/components.css"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css"/>
  <link rel="stylesheet" href="../assets/css/mesas.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-icon">
          <img src="../assets/IMG/LogoBlancoPC.png" class="image">
        </span>
        <div><div class="brand-name">PurísimoCafe</div><div class="brand-sub">Sistema de Gestión</div></div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">P</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Usuario</div>
        <div class="user-role" id="user-role">Rol</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <div class="nav-item" data-page="dashboard.html" onclick="navigate('dashboard.html')"><i class="fas fa-chart-pie"></i> Dashboard</div>
      <div class="nav-item active" data-page="mesas.html"><i class="fas fa-utensils"></i> Mesas</div>
      <div class="nav-section">Operaciones</div>
      <div class="nav-item" data-page="ventas.html" onclick="navigate('ventas.html')"><i class="fas fa-cash-register"></i> Nueva Venta</div>
      <div class="nav-item" data-page="historial.html" onclick="navigate('historial.html')"><i class="fas fa-receipt"></i> Historial Ventas</div>
      <div class="nav-section">Inventario</div>
      <div class="nav-item" data-page="inventario.html" data-admin-only onclick="navigate('inventario.html')"><i class="fas fa-boxes-stacked"></i> Inventario</div>
      <div class="nav-item" data-page="movimientos.html" data-admin-only onclick="navigate('movimientos.html')"><i class="fas fa-arrow-trend-down"></i> Movimientos</div>
      <div class="nav-section">Catálogo</div>
      <div class="nav-item" data-page="productos.html" onclick="navigate('productos.html')"><i class="fas fa-mug-hot"></i> Productos</div>
      <div class="nav-item" data-page="categorias.html" onclick="navigate('categorias.html')"><i class="fas fa-tags"></i> Categorías</div>
      <div class="nav-section">Administración</div>
      <div class="nav-item" data-page="usuarios.html" data-admin-only onclick="navigate('usuarios.html')"><i class="fas fa-users"></i> Usuarios</div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btn-logout"><i class="fas fa-right-from-bracket"></i> Cerrar Sesión</button>
    </div>
  </aside>
  <div class="overlay-mobile" id="overlay-mobile"></div>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <span class="topbar-title">Mesas</span>
      </div>
      <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span></div>
    </header>
    <div class="page-content anim-fade-up">
      <div class="section-header">
        <div>
          <div class="section-title">Mesas</div>
          <div style="font-size:.82rem;color:var(--cafe-warm);margin-top:2px;" id="mesas-count"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" id="btn-add-mesa"><i class="fas fa-plus"></i> Agregar Mesa</button>
          <button class="btn btn-secondary btn-sm" id="btn-remove-mesa"><i class="fas fa-minus"></i> Eliminar última</button>
          <button class="btn btn-secondary btn-sm" id="btn-reset-mesas"><i class="fas fa-rotate-left"></i> Liberar todas</button>
        </div>
      </div>
      <div class="mesas-grid" id="mesas-grid"></div>
    </div>
  </main>
</div>
<div id="toast-container"></div>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/modules/mesas.js"></script>
<script>
  if (!initPage('Mesas')) throw new Error('No auth');
  MesasModule.init();
</script>
</body>
</html>
