<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Productos — PurísimoCafe</title>
  <link rel="stylesheet" href="../assets/css/main.css"/>
  <link rel="stylesheet" href="../assets/css/components.css"/>
  <link rel="stylesheet" href="../assets/css/sidebar.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-icon">
          <img src="../assets/IMG/LogoBlancoPC.png" class="image">
        </span>
        <div><div class="brand-name">PurísimoCafe</div><div class="brand-sub">Sistema de Gestión</div></div>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">P</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Usuario</div>
        <div class="user-role" id="user-role">Rol</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <div class="nav-item" data-page="dashboard.html" onclick="navigate('dashboard.html')"><i class="fas fa-chart-pie"></i> Dashboard</div>
      <div class="nav-item" data-page="mesas.html" onclick="navigate('mesas.html')"><i class="fas fa-utensils"></i> Mesas</div>
      <div class="nav-section">Operaciones</div>
      <div class="nav-item" data-page="ventas.html" onclick="navigate('ventas.html')"><i class="fas fa-cash-register"></i> Nueva Venta</div>
      <div class="nav-item" data-page="historial.html" onclick="navigate('historial.html')"><i class="fas fa-receipt"></i> Historial Ventas</div>
      <div class="nav-section">Inventario</div>
      <div class="nav-item" data-page="inventario.html" onclick="navigate('inventario.html')" data-admin-only><i class="fas fa-boxes-stacked"></i> Inventario</div>
      <div class="nav-item" data-page="movimientos.html" onclick="navigate('movimientos.html')" data-admin-only><i class="fas fa-arrow-trend-down"></i> Movimientos</div>
      <div class="nav-section">Catálogo</div>
      <div class="nav-item active" data-page="productos.html"><i class="fas fa-mug-hot"></i> Productos</div>
      <div class="nav-item" data-page="categorias.html" onclick="navigate('categorias.html')"><i class="fas fa-tags"></i> Categorías</div>
      <div class="nav-section">Administración</div>
      <div class="nav-item" data-page="usuarios.html" onclick="navigate('usuarios.html')" data-admin-only><i class="fas fa-users"></i> Usuarios</div>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btn-logout"><i class="fas fa-right-from-bracket"></i> Cerrar Sesión</button>
    </div>
  </aside>
  <div class="overlay-mobile" id="overlay-mobile"></div>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <span class="topbar-title">Productos</span>
      </div>
      <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span></div>
    </header>
    <div class="page-content anim-fade-up">
      <div class="section-header">
        <div class="section-title">Productos</div>
        <button class="btn btn-primary" id="btn-nuevo-producto"><i class="fas fa-plus"></i> Nuevo Producto</button>
      </div>
      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search-prod" placeholder="Buscar producto..."/>
          </div>
          <div class="filter-tabs">
            <button class="filter-tab active" data-estado="activos"><i class="fas fa-circle-check"></i> Activos</button>
            <button class="filter-tab" data-estado="inactivos"><i class="fas fa-ban"></i> Inactivos</button>
            <button class="filter-tab" data-estado="todos"><i class="fas fa-list"></i> Todos</button>
          </div>
        </div>
        <table>
          <thead>
            <tr><th>Nombre</th><th>Categoría</th><th>Costo</th><th>Precio</th><th>Margen</th><th>Estado</th><th>Acciones</th></tr>
          </thead>
          <tbody id="productos-table">
            <tr class="loading-row"><td colspan="7">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL PRODUCTO -->
<div class="modal-overlay" id="modal-producto">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-prod-title">Nuevo Producto</div>
      <button class="modal-close" data-close="modal-producto"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="prod-id"/>
      <div class="form-grid">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="prod-nombre" placeholder="Ej: Café Americano"/>
        </div>
        <div class="field">
          <label>Categoría</label>
          <select id="prod-categoria"><option value="">Selecciona...</option></select>
        </div>
        <div class="field">
          <label>Costo de Producción (C$)</label>
          <input type="number" id="prod-costo" placeholder="0.00" step="0.01" min="0"/>
        </div>
        <div class="field">
          <label>Precio de Venta (C$)</label>
          <input type="number" id="prod-precio" placeholder="0.00" step="0.01" min="0"/>
        </div>
        <div class="field field-full">
          <label>Descripción</label>
          <textarea id="prod-desc" placeholder="Descripción del producto..."></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-close="modal-producto">Cancelar</button>
      <button class="btn btn-primary" id="btn-save-producto"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/models/Producto.js"></script>
<script src="../assets/js/models/Categoria.js"></script>
<script src="../assets/js/services/ProductoService.js"></script>
<script src="../assets/js/services/CategoriaService.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/modules/productos.js"></script>
</body>
</html>
