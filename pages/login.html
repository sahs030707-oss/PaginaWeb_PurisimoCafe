<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión — PurísimoCafe</title>
  <link rel="stylesheet" href="../assets/css/main.css"/>
  <link rel="stylesheet" href="../assets/css/components.css"/>
  <link rel="stylesheet" href="../assets/css/login.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
  <div id="toast-container"></div>

  <div class="login-card">
    <div class="login-logo">
      <img src="../assets/IMG/LogoNegativoPC.png" class="image">
      <h1>PurísimoCafe</h1>
      <p>MASATEPE</p>
    </div>

    <div class="form-group">
      <label>Correo electrónico</label>
      <input type="email" id="login-email" placeholder="correo@ejemplo.com" autocomplete="username"/>
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/>
    </div>

    <button class="btn-login" id="btn-login">Iniciar Sesión</button>
    <p class="login-error" id="login-error"></p>
  </div>

  <script src="../assets/js/core/api.js"></script>
<script src="../assets/js/services/LoginService.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/modules/login.js"></script>
</body>
</html>
